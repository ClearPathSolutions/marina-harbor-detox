  - main [ref=e44]:
    - heading "Drug & Alcohol Rehab Admissions San Francisco" [level=1] [ref=e50]
    - article [ref=e51]:
      - generic [ref=e53]:
        - paragraph [ref=e54]: Begin your journey at Marina Harbor. We offer seamless rehab admissions in San Francisco with 24/7 support and insurance verification.
        - generic [ref=e55]:
          - generic [ref=e57]:
            - heading "Take the First Step Toward Renewal" [level=2] [ref=e58]:
              - generic [ref=e59]: "01"
            - paragraph [ref=e61]: Deciding to seek treatment is a courageous turning point. At Marina Harbor, we make the admissions process as seamless and discreet as possible, allowing you to focus entirely on your recovery. From the moment you contact us, our compassionate admissions team serves as your personal advocate, handling everything from insurance verification to travel logistics with the utmost professionalism. Whether you are seeking care for yourself or a loved one, we are here to provide the clinical guidance and logistical support you need to start your journey today.
            - heading "I Need Help For Myself" [level=3] [ref=e62]
            - paragraph [ref=e63]: Take the courageous first step toward a private, boutique recovery experience designed to help you reclaim your health and professional life.
            - heading "I Need Help For A Loved One" [level=3] [ref=e64]
            - paragraph [ref=e65]: Find peace of mind with our dedicated admissions advocates, who will guide you through insurance verification and concierge travel for your family member.
          - generic [ref=e67]:
            - heading "Begin Your Journey to Recovery Today" [level=2] [ref=e68]:
              - generic [ref=e69]: "02"
            - paragraph [ref=e71]: Your privacy is our highest priority. Use the secure form below to submit a confidential inquiry. Our admissions specialists will review your information and contact you shortly to discuss your unique needs, answer clinical questions, and provide a comprehensive verification of your insurance benefits.
            - paragraph [ref=e72]: A Streamlined Path to Recovery
          - generic [ref=e74]:
            - heading "The Step-by-Step Admissions Process" [level=2] [ref=e75]:
              - generic [ref=e76]: "03"
            - paragraph [ref=e78]: "We have refined our intake process to ensure you can enter our San Francisco facility quickly and safely. Our goal is to remove the hurdles between you and the high-level care you deserve. You can expect:"
            - heading "1. Initial Consultation" [level=3] [ref=e79]
            - paragraph [ref=e80]: Speak directly with an admissions expert to discuss your history, current needs, and the specialized programs we offer, such as our executive or first responder tracks.
            - heading "2. Insurance Verification" [level=3] [ref=e81]
            - paragraph [ref=e82]: Our team performs a rapid, comprehensive verification of your PPO insurance benefits to maximize your coverage and minimize out-of-pocket costs.
            - heading "3. Clinical Assessment" [level=3] [ref=e83]
            - paragraph [ref=e84]:
              - text: A brief, confidential screening to ensure our levels of care, from
              - link "medical detox" [ref=e85] [cursor=pointer]:
                - /url: /what-we-offer/detox-san-francisco/
              - text: to
              - link "residential treatment" [ref=e86] [cursor=pointer]:
                - /url: /what-we-offer/inpatient-rehab-san-francisco/
              - text: ", are perfectly aligned with your recovery goals."
            - figure [ref=e87]
            - heading "4. Concierge Arrival" [level=3] [ref=e88]
            - paragraph [ref=e89]: We coordinate all logistics, including private, discreet transport from SFO, OAK, or SJC airports directly to our boutique San Francisco facility.
            - paragraph [ref=e90]: Safeguarding Your Professional Future
          - generic [ref=e92]:
            - heading "Career Protection & FMLA Support" [level=2] [ref=e93]:
              - generic [ref=e94]: "04"
            - paragraph [ref=e96]: We understand that for our San Francisco executives and professionals, the decision to enter residential treatment involves navigating complex career responsibilities. You shouldn’t have to choose between your health and your livelihood. Our admissions team provides expert guidance on navigating the Family and Medical Leave Act (FMLA) and other job protection resources available to California employees.
          - generic [ref=e98]:
            - heading "Hear from Our Alumni" [level=2] [ref=e99]:
              - generic [ref=e100]: "05"
            - paragraph [ref=e102]: At Marina Harbor, the success of our residents is the true measure of our clinical excellence. We are honored to have played a role in the recovery journeys of professionals, executives, and families from across San Francisco and beyond. These testimonials reflect our commitment to providing a private, compassionate, and highly effective healing environment.
